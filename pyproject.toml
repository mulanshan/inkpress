[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inkpress"
version = "0.1.0"
description = "Self-hosted editorial reading website & zero-E999 Kindle publishing studio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
  "aiosmtplib>=3.0,<5",
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "beautifulsoup4>=4.12,<5",
  "croniter>=3.0,<7",
  "cryptography>=44.0,<47",
  "fastapi>=0.116,<1",
  "feedparser>=6.0,<7",
  "httpx[http2,socks]>=0.28,<1",
  "lxml>=5.3,<7",
  "markdown>=3.7,<4",
  "nh3>=0.2.20,<1",
  "openai>=1.65,<3",
  "pillow>=11.0,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "pyjwt>=2.10,<3",
  "pymupdf>=1.25,<2",
  "pysocks>=1.7.1,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qrcode[pil]>=8.0,<9",
  "readability-lxml>=0.8.1,<1",
  "redis>=5.2,<8",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "structlog>=25.1,<26",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6.0,<7",
  "ruff>=0.11,<1",
  "types-beautifulsoup4",
  "types-markdown",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/inkpress"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
packages = ["inkpress"]
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["croniter", "croniter.*"]
ignore_missing_imports = true
follow_untyped_imports = true
